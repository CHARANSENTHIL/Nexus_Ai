version: '3.8'

services:
  nexus-gateway:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: nexus-gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_ALLOWED_USER_IDS=${TELEGRAM_ALLOWED_USER_IDS}
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - REDIS_HOST=nexus-redis
      - REDIS_PORT=6379
    volumes:
      - ./backend:/app/backend
      - ~/.nexus_ai:/root/.nexus_ai
    depends_on:
      - nexus-redis
    networks:
      - nexus-network

  nexus-worker-browser:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: nexus-worker-browser
    restart: unless-stopped
    command: python backend/run_bot.py
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - REDIS_HOST=nexus-redis
      - REDIS_PORT=6379
    volumes:
      - ./backend:/app/backend
      - ~/.nexus_ai:/root/.nexus_ai
    depends_on:
      - nexus-redis
    networks:
      - nexus-network

  nexus-redis:
    image: redis:7-alpine
    container_name: nexus-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - nexus-network

volumes:
  redis-data:

networks:
  nexus-network:
    driver: bridge
